name: CI

# Builds stage 0 (bootstrap/) with the devkit's Zig and runs its test corpus,
# on every host the devkit supports that QBE can target. Pull requests and
# pushes to main and dev are built.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  stage0:
    name: Stage 0 on ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: x86_64-linux-musl, runner: ubuntu-24.04 }
          - { host: aarch64-linux-musl, runner: ubuntu-24.04-arm }
          - { host: x86_64-windows-gnu, runner: windows-2025 }
          - { host: x86_64-macos-none, runner: macos-15-intel }
          - { host: aarch64-macos-none, runner: macos-15 }
    steps:
      # the submodules (buildtools, the cspell dictionary) are not needed
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch the devkit
        run: python tools/fetch-devkit.py --host "${{ matrix.host }}"

      - name: Build and test stage 0
        run: .devkit/zig/zig build test -Dtarget="${{ matrix.host }}" --summary all

  # the one check the rulesets require
  ci:
    name: CI
    needs: [stage0]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case $r in
              success | skipped) ;;
              *) echo "::error::a job ended as $r"; exit 1 ;;
            esac
          done
