# Closes the issues a pull request names ("Closes #N") when it is merged
# into dev; GitHub does that by itself only for the default branch.
name: Close issues

on:
  pull_request_target:
    types: [closed]
    branches: [dev]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged
    uses: cesiumlang/.github/.github/workflows/close-issues.yml@main
