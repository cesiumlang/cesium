# Skein reads the proposals, the specification and the tests' citations of it
# (proposals/0000-documentation-system.md). Types and links not in .skein/
# come from Skein's langspec template.
template = "langspec"

[project]
name = "Cesium"
id = "cesiumlang/cesium"

# one file per proposal, with front matter
[[sources]]
path = "proposals"
kind = "items"
type = "proposal"

# the charter, a proposal of its own (P-0001); other files in docs/ are not items
[[sources]]
path = "docs"
kind = "items"
type = "proposal"

# the specification: rules, terms and examples in Markdown chapters
[[sources]]
path = "spec"

# the conformance tests cite the rules they check: `// spec: lex.comment.line`
[[citations]]
name = "test"
path = "bootstrap/tests"
files = [".csm"]
marker = "// spec:"
to = ["rule"]
review = true
# coverage reports the rules no test cites yet; it does not fail CI
expected = true
